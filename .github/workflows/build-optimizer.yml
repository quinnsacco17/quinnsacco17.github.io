name: Build Setup Optimizer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pc-optimizer/**', '.github/workflows/build-optimizer.yml']
  pull_request:
    paths: ['pc-optimizer/**', '.github/workflows/build-optimizer.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: pc-optimizer

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - run: npm run dist:win
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-windows
          path: |
            pc-optimizer/dist/*.exe
            pc-optimizer/dist/*.yml

  macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - run: npm run dist:mac
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-mac
          path: pc-optimizer/dist/*.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/SetupOptimizer-windows/*.exe
            out/SetupOptimizer-mac/*.dmg
          generate_release_notes: true
