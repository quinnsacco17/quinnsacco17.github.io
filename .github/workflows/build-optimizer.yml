name: Build Setup Optimizer

on:
  push:
    branches: [main]
    paths: ['pc-optimizer/**', '.github/workflows/build-optimizer.yml']
  pull_request:
    paths: ['pc-optimizer/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: pc-optimizer

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - run: npm run dist:win
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-windows
          path: |
            pc-optimizer/dist/*.exe
            pc-optimizer/dist/*.yml

  macos:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - run: npm run dist:mac
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-mac
          path: pc-optimizer/dist/*.dmg
