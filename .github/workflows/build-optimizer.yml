name: Build Setup Optimizer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pc-optimizer/**', '.github/workflows/build-optimizer.yml']
  pull_request:
    paths: ['pc-optimizer/**', '.github/workflows/build-optimizer.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: pc-optimizer

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - name: Bundle PresentMon (frame-time capture, MIT)
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'setup-optimizer-ci' }
          $rels = Invoke-RestMethod -Headers $h 'https://api.github.com/repos/GameTechDev/PresentMon/releases?per_page=10'
          $assets = $rels | Where-Object { -not $_.prerelease } | ForEach-Object { $_.assets }
          $a = $assets | Where-Object { $_.name -match '^PresentMon-[\d\.]+-x64\.exe$' } | Select-Object -First 1
          if (-not $a) { $a = $assets | Where-Object { $_.name -match 'PresentMon.*x64.*\.exe$' -and $_.name -notmatch 'Capture|Setup|Install|App' } | Select-Object -First 1 }
          Write-Host "Assets seen: $(( $assets | Select-Object -First 12 | ForEach-Object { $_.name }) -join ', ')"
          if (-not $a) { Write-Host '::warning::PresentMon console exe not found; Measure will fall back to manual entry'; exit 0 }
          New-Item -ItemType Directory -Force pc-optimizer/vendor | Out-Null
          Invoke-WebRequest -Headers $h $a.browser_download_url -OutFile pc-optimizer/vendor/PresentMon.exe
          Invoke-WebRequest 'https://raw.githubusercontent.com/GameTechDev/PresentMon/main/LICENSE.txt' -OutFile pc-optimizer/vendor/PresentMon-LICENSE.txt
          Write-Host "Bundled $($a.name)"
      - name: Check PresentMon accepts the app's arguments
        shell: pwsh
        working-directory: pc-optimizer
        run: |
          if (-not (Test-Path vendor/PresentMon.exe)) { exit 0 }
          & ./vendor/PresentMon.exe --help 2>&1 | Select-Object -First 80 | Out-String | Write-Host
          $out = Join-Path $env:RUNNER_TEMP 'pm-test.csv'
          $p = Start-Process -FilePath ./vendor/PresentMon.exe -ArgumentList '--output_file',$out,'--timed','3','--terminate_after_timed','--stop_existing_session','--session_name','SetupOptimizerCI','--v1_metrics','--no_console_stats' -Wait -PassThru -NoNewWindow
          Write-Host "PresentMon exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host '::error::PresentMon rejected the arguments the app uses'; exit 1 }
          if (Test-Path $out) { Get-Content $out -TotalCount 3 | Write-Host } else { Write-Host 'No CSV (no apps presented frames on the runner), arguments accepted.' }
      - run: npm run dist:win
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-windows
          path: |
            pc-optimizer/dist/*.exe
            pc-optimizer/dist/*.yml

  macos:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: pc-optimizer
      - run: npm run dist:mac
        working-directory: pc-optimizer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SetupOptimizer-mac
          path: pc-optimizer/dist/*.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/SetupOptimizer-windows/*.exe
            out/SetupOptimizer-mac/*.dmg
          generate_release_notes: true
